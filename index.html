<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiboN 会員証</title>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- JsBarcode (バーコード生成ライブラリ ) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        body { background-color: #d0c2b2; font-size: 0.9rem; }
        .card { border-radius: 12px; border: none; }
        .required::after { content: " *"; color: #dc3545; }
        .form-label { font-weight: 600; color: #495057; }
        /* バーコード画像の調整 */
        #barcode { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-success"></div>
        <p id="status" class="mt-3 fw-bold">システムを起動中...</p>
    </div>

    <div id="app" class="container py-4" style="display:none;"></div>

    <script>
        // --- 設定値 ---
        // const LIFF_ID = "2008741629-Jtd0iNts"; // DEV
        const LIFF_ID = "2008741631-8XHl1q1V";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyYskFgKCMNYAGB-rxa0_XepQ9M-OdV853gHx1UAFCPnPkX0Ts20YQYHmmVqQCluWo/exec"; 

        // XSS対策用のエスケープ関数
        const escapeHTML = (str) => {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[match]);
        };

        // タイムアウト付きのfetch関数
        const fetchWithTimeout = async (resource, options = {}) => {
            const { timeout = 15000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        };

        async function init() {
            const status = document.getElementById('status');
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); return; }

                const profile = await liff.getProfile();
                const userId = profile.userId;

                status.innerText = "会員情報を照会しています...";
                
                // タイムアウト付きでGASを呼び出し
                const res = await fetchWithTimeout(`${GAS_URL}?uid=${userId}`, { timeout: 15000 });
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';
                const app = document.getElementById('app');
                app.style.display = 'block';

                if (data.found) {
                    renderCard(data);
                } else {
                    renderForm(userId);
                }
            } catch (err) {
                let errorMsg = err.message;
                if (err.name === 'AbortError') {
                    errorMsg = "サーバーの応答がタイムアウトしました。通信環境を確認し、再読み込みしてください。";
                }
                status.innerHTML = `<div class="alert alert-danger mx-3">エラー: ${escapeHTML(errorMsg)}</div>`;
            }
        }

        function renderForm(userId) {
            document.getElementById('app').innerHTML = `
                <div class="card shadow p-4 mb-5">
                    <h5 class="text-center mb-4 fw-bold">新規会員登録</h5>
                    <form id="regForm" novalidate>
                        <!-- (フォームの内容は元コードと同じため省略・必要に応じて適宜復元してください) -->
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label required">姓</label>
                                <input type="text" id="lastName" class="form-control" placeholder="山田" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label required">名</label>
                                <input type="text" id="firstName" class="form-control" placeholder="太郎" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label required">セイ（カナ）</label>
                                <input type="text" id="lastKana" class="form-control" placeholder="ヤマダ" pattern="^[ァ-ヶー]+$" title="全角カタカナで入力してください" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label required">メイ（カナ）</label>
                                <input type="text" id="firstKana" class="form-control" placeholder="タロウ" pattern="^[ァ-ヶー]+$" title="全角カタカナで入力してください" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">電話番号</label>
                            <input type="tel" id="mobileNumber" class="form-control" placeholder="09012345678" pattern="^\\d{10,11}$" title="ハイフンなしの10桁または11桁の数字で入力してください" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">メールアドレス</label>
                            <input type="email" id="mailAddress" class="form-control" placeholder="example@mail.com" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label required">性別</label>
                                <select id="sex" class="form-select" required>
                                    <option value="">選択してください</option>
                                    <option value="0">不明</option>
                                    <option value="1">男性</option>
                                    <option value="2">女性</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label required">生年月日</label>
                                <input type="date" id="birthDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">郵便番号</label>
                            <input type="text" id="postCode" class="form-control" placeholder="1234567" pattern="^\\d{7}$" title="ハイフンなしの7桁の数字で入力してください" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">住所</label>
                            <input type="text" id="address" class="form-control" placeholder="東京都渋谷区..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">SNSへの施術写真掲載について</label>
                            <select id="note" class="form-select" required>
                                <option value="SNS掲載可">当店SNSへの施術写真掲載許諾</option>
                                <option value="SNS掲載不可">当店SNSへの施術写真掲載不可</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">備考</label>
                            <textarea id="note2" class="form-control" placeholder="アレルギーや紹介者名（あれば）" rows="2"></textarea>
                        </div>
                        <button type="submit" id="subBtn" class="btn btn-success w-100 py-3 mt-3 fw-bold">登録を完了する</button>
                    </form>
                </div>`;
        
            const form = document.getElementById('regForm');
            form.onsubmit = async (e) => {
                e.preventDefault();
        
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
        
                const btn = document.getElementById('subBtn');
                btn.disabled = true;
                btn.innerText = "登録中...";
        
                const payload = {
                    lineUserId: userId,
                    lastName: document.getElementById('lastName').value.trim(),
                    firstName: document.getElementById('firstName').value.trim(),
                    lastKana: document.getElementById('lastKana').value.trim(),
                    firstKana: document.getElementById('firstKana').value.trim(),
                    mobileNumber: document.getElementById('mobileNumber').value.replace(/[\s-]/g, ''),
                    mailAddress: document.getElementById('mailAddress').value.trim(),
                    sex: document.getElementById('sex').value,
                    birthDate: document.getElementById('birthDate').value,
                    postCode: document.getElementById('postCode').value.replace(/[\s-]/g, ''),
                    address: document.getElementById('address').value.trim(),
                    note: document.getElementById('note').value,
                    note2: document.getElementById('note2').value.trim() || null
                };
        
                try {
                    const response = await fetchWithTimeout(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        timeout: 20000 // POSTは少し長めに設定
                    });
                    const result = await response.json();
                    if (result.success) {
                        alert("会員登録が完了しました！");
                        location.reload();
                    } else {
                        throw new Error(result.error || "登録に失敗しました");
                    }
                } catch (err) {
                    let errorMsg = err.message;
                    if (err.name === 'AbortError') {
                        errorMsg = "サーバーの応答がタイムアウトしました。";
                    }
                    alert("エラー: " + errorMsg);
                    btn.disabled = false;
                    btn.innerText = "登録を完了する";
                }
            };
        }

        function renderCard(data) {
            if (!data.code) {
                alert("会員コードの取得に失敗しました。");
                return;
            }

            // XSS対策としてデータをエスケープ
            const safeName = escapeHTML(data.name);
            const safePoint = escapeHTML(String(data.point));
            const safeCode = escapeHTML(String(data.code));

            document.getElementById('app').innerHTML = `
                <div class="card bg-success text-white shadow-lg border-0 mb-3">
                    <div class="card-body p-4 text-center">
                        <p class="small text-uppercase mb-2" style="letter-spacing: 2px;">Membership Card</p>
                        <h4 class="mb-4">${safeName} 様</h4>
                        
                        <div class="bg-white text-dark rounded-pill py-2 px-4 d-inline-block mb-4 shadow-sm">
                            <span class="small fw-bold">保有ポイント:</span>
                            <span class="h4 mb-0 fw-bold text-success"> ${safePoint} </span>
                            <span class="small">pt</span>
                        </div>

                        <div class="bg-white p-3 rounded mb-3">
                            <!-- 外部APIではなく、JsBarcode用のsvgタグを配置 -->
                            <svg id="barcode"></svg>
                        </div>
                        <p class="mb-0 small opacity-75">No. ${safeCode}</p>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button onclick="location.reload()" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">
                        情報を更新する
                    </button>
                </div>`;
            
            // JsBarcodeを使用してローカルでバーコードを生成
            JsBarcode("#barcode", safeCode, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 60,
                displayValue: false // 下部に番号は表示しない（HTML側で表示しているため）
            });
        }
        init();
    </script>
</body>
</html>
