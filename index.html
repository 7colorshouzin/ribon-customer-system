<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiboN 会員証</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    body { background-color: #d0c2b2; font-size: 0.9rem; }
    .card { border-radius: 12px; border: none; }
    .required::after { content: " *"; color: #dc3545; }
    .form-label { font-weight: 600; color: #495057; }
    #barcode { max-width: 100%; height: auto; }

    .skeleton-text, .skeleton-point, .skeleton-barcode {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
    }
    .skeleton-text { width: 80%; height: 28px; margin: 10px auto; }
    .skeleton-point { width: 50%; height: 48px; margin: 10px auto; }
    .skeleton-barcode { width: 90%; height: 80px; margin: 10px auto; }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .loaded {
      background: none !important;
      animation: none !important;
      height: auto !important;
      width: auto !important;
    }
    #form-section { display: none; }
    .privacy-link { color: #198754; text-decoration: underline; }
    .privacy-text { font-size: 0.8rem; color: #6c757d; }
  </style>
</head>
<body>
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status" aria-label="読み込み中"></div>
    <p id="status" class="mt-3 fw-bold">システムを起動中...</p>
  </div>

  <main id="app" class="container py-4" style="display:none;">
    <section id="card-section" style="display:none;" aria-label="会員証">
      <div class="card bg-success text-white shadow-lg border-0 mb-3">
        <div class="card-body p-4 text-center">
          <p class="small text-uppercase mb-2" style="letter-spacing: 2px;">Membership Card</p>
          <h4 id="customer-name" class="mb-4 skeleton-text"></h4>

          <div class="bg-white text-dark rounded-pill py-2 px-4 d-inline-block mb-4 shadow-sm">
            <span class="small fw-bold">保有ポイント:</span>
            <span id="customer-point" class="h4 mb-0 fw-bold text-success skeleton-point"></span>
            <span class="small">pt</span>
          </div>

          <div class="bg-white p-3 rounded mb-3">
            <svg id="barcode" class="skeleton-barcode" aria-label="会員バーコード"></svg>
          </div>
          <p class="mb-0 small opacity-75">
            No. <span id="customer-code-display" class="skeleton-text" style="width: 40%; height: 18px; display: inline-block;"></span>
          </p>
        </div>
      </div>
      <div class="text-center mt-3">
        <button type="button" id="refresh-card-button" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">
          情報を更新する
        </button>
      </div>
    </section>

    <section id="form-section" aria-label="新規会員登録">
      <div class="card shadow p-4 mb-5">
        <h5 class="text-center mb-4 fw-bold">新規会員登録</h5>
        <div id="form-notice" class="d-none" role="alert"></div>

        <form id="regForm" novalidate>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="lastName" class="form-label required">姓</label>
              <input type="text" id="lastName" class="form-control" placeholder="山田" required autocomplete="family-name">
            </div>
            <div class="col-6">
              <label for="firstName" class="form-label required">名</label>
              <input type="text" id="firstName" class="form-control" placeholder="太郎" required autocomplete="given-name">
            </div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="lastKana" class="form-label required">セイ（カナ）</label>
              <input type="text" id="lastKana" class="form-control" placeholder="ヤマダ" pattern="^[ァ-ヶー]+$" title="全角カタカナで入力してください" required>
            </div>
            <div class="col-6">
              <label for="firstKana" class="form-label required">メイ（カナ）</label>
              <input type="text" id="firstKana" class="form-control" placeholder="タロウ" pattern="^[ァ-ヶー]+$" title="全角カタカナで入力してください" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="mobileNumber" class="form-label required">電話番号</label>
            <input type="tel" id="mobileNumber" class="form-control" placeholder="09012345678" pattern="^\d{10,11}$" title="ハイフンなしの10桁または11桁の数字で入力してください" required autocomplete="tel">
          </div>
          <div class="mb-3">
            <label for="mailAddress" class="form-label required">メールアドレス</label>
            <input type="email" id="mailAddress" class="form-control" placeholder="example@mail.com" required autocomplete="email">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="sex" class="form-label required">性別</label>
              <select id="sex" class="form-select" required>
                <option value="">選択してください</option>
                <option value="0">不明</option>
                <option value="1">男性</option>
                <option value="2">女性</option>
              </select>
            </div>
            <div class="col-6">
              <label for="birthDate" class="form-label required">生年月日</label>
              <input type="date" id="birthDate" class="form-control" required autocomplete="bday">
            </div>
          </div>
          <div class="mb-3">
            <label for="postCode" class="form-label required">郵便番号</label>
            <input type="text" id="postCode" class="form-control" placeholder="1234567" pattern="^\d{7}$" title="ハイフンなしの7桁の数字で入力してください" required autocomplete="postal-code">
          </div>
          <div class="mb-3">
            <label for="address" class="form-label required">住所</label>
            <input type="text" id="address" class="form-control" placeholder="東京都渋谷区..." required autocomplete="street-address">
          </div>
          <div class="mb-3">
            <label for="note" class="form-label required">SNSへの施術写真掲載について</label>
            <select id="note" class="form-select" required>
              <option value="SNS掲載可">当店SNSへの施術写真掲載許諾</option>
              <option value="SNS掲載不可">当店SNSへの施術写真掲載不可</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="note2" class="form-label">備考</label>
            <textarea id="note2" class="form-control" placeholder="アレルギーや紹介者名（あれば）" rows="2"></textarea>
          </div>

          <div class="mb-3 text-center privacy-text">
            登録ボタンを押すことで、<a href="https://7colors-group.com/privacy/" target="_blank" rel="noopener noreferrer" class="privacy-link">株式会社7&COLORS プライバシーポリシー</a>に同意したものとみなします。
          </div>

          <button type="submit" id="subBtn" class="btn btn-success w-100 py-3 mt-2 fw-bold">同意して登録を完了する</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // --- 設定値 ---
    // const LIFF_ID = "2008741629-Jtd0iNts"; // 開発用
    const LIFF_ID = "2008741631-8XHl1q1V";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxSRjULB3c8zYN6pN4ga2XPIxuRW3iF2MLa089U_n3lnltpskgAUxug5_Pt50u12FQ/exec"; // GASデプロイする度に更新する

    // 同じページ上で、登録処理を重ねて開始しないためのフラグです。
    let isSubmittingRegistration = false;

    const escapeHTML = (value) => {
      return String(value ?? '').replace(/[&<>"'`]/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
        '`': '&#x60;'
      })[character]);
    };

    const fetchWithTimeout = async (resource, options = {}) => {
      const { timeout = 15000, ...fetchOptions } = options;
      const controller = new AbortController();
      const timerId = window.setTimeout(() => controller.abort(), timeout);

      try {
        return await fetch(resource, { ...fetchOptions, signal: controller.signal });
      } finally {
        window.clearTimeout(timerId);
      }
    };

    const getErrorMessage = (error) => {
      if (error && error.name === 'AbortError') {
        return 'サーバーの応答がタイムアウトしました。通信環境を確認して、もう一度お試しください。';
      }
      return error && error.message ? error.message : '予期しないエラーが発生しました。';
    };

    const showFormNotice = (message, type = 'warning') => {
      const notice = document.getElementById('form-notice');
      notice.className = `alert alert-${type}`;
      notice.textContent = message;
    };

    async function init() {
      const statusElement = document.getElementById('status');
      const loadingSection = document.getElementById('loading');
      const appSection = document.getElementById('app');
      const cardSection = document.getElementById('card-section');
      const formSection = document.getElementById('form-section');

      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;
        statusElement.textContent = '会員情報を照会しています...';

        // キャッシュを避け、スマレジの最新の氏名・ポイントをGASから取得します。
        const response = await fetchWithTimeout(`${GAS_URL}?uid=${encodeURIComponent(userId)}&t=${Date.now()}`, {
          timeout: 15000
        });
        if (!response.ok) {
          throw new Error(`会員情報の照会に失敗しました（HTTP ${response.status}）。`);
        }
        const data = await response.json();

        loadingSection.style.display = 'none';
        appSection.style.display = 'block';

        if (data.found) {
          renderCard(data);
          cardSection.style.display = 'block';
          return;
        }

        renderForm(userId);
        formSection.style.display = 'block';
        if (data.pending) {
          showFormNotice(
            data.message || '前回の登録処理を確認しています。入力して再度登録しても、同じLINEアカウントの会員情報は重複登録されません。'
          );
        }
      } catch (error) {
        statusElement.innerHTML = `<div class="alert alert-danger mx-3">エラー: ${escapeHTML(getErrorMessage(error))}</div>`;
        loadingSection.style.display = 'block';
      }
    }

    function renderForm(userId) {
      const form = document.getElementById('regForm');
      const button = document.getElementById('subBtn');

      form.onsubmit = async (event) => {
        event.preventDefault();

        // ダブルタップ・Enter連打・イベントの重複発火をブラウザ側でも防止します。
        if (isSubmittingRegistration) return;

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        isSubmittingRegistration = true;
        button.disabled = true;
        button.textContent = '登録中...';

        const payload = {
          lineUserId: userId,
          lastName: document.getElementById('lastName').value.trim(),
          firstName: document.getElementById('firstName').value.trim(),
          lastKana: document.getElementById('lastKana').value.trim(),
          firstKana: document.getElementById('firstKana').value.trim(),
          mobileNumber: document.getElementById('mobileNumber').value.replace(/[^\d]/g, ''),
          mailAddress: document.getElementById('mailAddress').value.trim(),
          sex: document.getElementById('sex').value,
          birthDate: document.getElementById('birthDate').value,
          postCode: document.getElementById('postCode').value.replace(/[^\d]/g, ''),
          address: document.getElementById('address').value.trim(),
          note: document.getElementById('note').value,
          note2: document.getElementById('note2').value.trim() || null
        };

        try {
          const response = await fetchWithTimeout(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            timeout: 30000
          });
          if (!response.ok) {
            throw new Error(`登録リクエストに失敗しました（HTTP ${response.status}）。`);
          }

          const result = await response.json();
          if (!result.success) {
            throw new Error(result.error || '登録に失敗しました。');
          }

          alert(result.alreadyRegistered
            ? 'すでに登録済みです。会員証を表示します。'
            : '会員登録が完了しました。会員証を表示します。'
          );
          // 再読み込み後、GASがスマレジの最新氏名・ポイントを取得して会員証を表示します。
          window.location.reload();
        } catch (error) {
          const message = getErrorMessage(error);
          const timeoutHint = error && error.name === 'AbortError'
            ? ' 登録済みかどうかは、数秒待ってから会員証を開き直して確認してください。再送しても多重登録はされません。'
            : '';
          alert(`エラー: ${message}${timeoutHint}`);
          isSubmittingRegistration = false;
          button.disabled = false;
          button.textContent = '同意して登録を完了する';
        }
      };
    }

    function renderCard(data) {
      if (!data.code) {
        alert('会員コードの取得に失敗しました。');
        return;
      }

      const customerNameElement = document.getElementById('customer-name');
      const customerPointElement = document.getElementById('customer-point');
      const customerCodeDisplayElement = document.getElementById('customer-code-display');
      const barcodeElement = document.getElementById('barcode');

      // innerText / textContentで挿入するため、スマレジで修正された氏名も安全にそのまま表示できます。
      customerNameElement.textContent = `${String(data.name || '')} 様`;
      customerPointElement.textContent = String(data.point ?? 0);
      customerCodeDisplayElement.textContent = String(data.code);

      customerNameElement.classList.add('loaded');
      customerPointElement.classList.add('loaded');
      customerCodeDisplayElement.classList.add('loaded');
      barcodeElement.classList.add('loaded');

      JsBarcode('#barcode', String(data.code), {
        format: 'CODE128',
        lineColor: '#000',
        width: 2,
        height: 60,
        displayValue: false
      });
    }

    document.getElementById('refresh-card-button').addEventListener('click', () => {
      window.location.reload();
    });

    init();
  </script>
</body>
</html>
